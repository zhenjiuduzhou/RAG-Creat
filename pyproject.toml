[project]
name = "ragstudio"
version = "0.1.0"
description = "Local Windows RAG knowledge base builder"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "beautifulsoup4>=4.12,<5",
  "sentence-transformers>=5,<7",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyinstaller>=6,<7", "reportlab>=4,<6"]

[project.scripts]
ragstudio = "ragstudio.app:main"
ragstudio-server = "ragstudio.serve:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragstudio*"]
